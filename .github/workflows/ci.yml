name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    defaults:
      run:
        # Windows runner 也有 bash；统一用它，`test/*.test.ts` 的通配才能展开
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 不在 install 阶段跑 prepare：先装依赖，再显式 typecheck/test/build，
      # 失败时能看清是哪一步
      - run: npm ci --ignore-scripts

      # 但 better-sqlite3 是原生模块，--ignore-scripts 连它的 install 一起跳过了：
      # 缺 better_sqlite3.node 时，所有走 sqlite checkpoint 的测试都会
      # 「Could not locate the bindings file」而失败。单独补这一步（prebuild-install
      # 优先拿预编译二进制，拿不到再 node-gyp 编译）。
      - run: npm rebuild better-sqlite3

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
